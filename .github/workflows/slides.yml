name: Build slides

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # 토큰이 테마에 반영됐는지 확인 (tokens.json만 고치고 sync를 잊은 PR 방지)
      - run: npm run tokens && git diff --exit-code tokens/tokens.css themes/causal-lab.css
      - run: npm run build
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.3"
      - run: uv sync --frozen --project chapters/w02 --python 3.11
      - run: uv run --frozen --project chapters/w02 python chapters/w02/check_regression.py
      - run: uv run --frozen --project chapters/w02 python chapters/w02/check_launcher.py
      - run: |
          uv run --frozen --project chapters/w02 python scripts/build-week02.py
          node scripts/build-index.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
